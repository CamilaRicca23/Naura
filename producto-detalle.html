
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Producto — NAURA</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/img_logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>

<body>

  <!-- ==========================================
       1. HEADER
       ========================================== -->

  <div id="header-placeholder"></div>


  <!-- ==========================================
       2. CONTENIDO PRINCIPAL
       ========================================== -->

  <main>

    <section class="detalle-producto contenedor">

      <!-- Volver al listado -->

      <a
        href="productos.html"
        class="detalle-producto__volver"
      >
        ← Volver a productos
      </a>


      <!-- Estado de carga -->

      <p id="estado-detalle" role="status">
        Cargando producto...
      </p>


      <!-- Detalle del producto -->

      <div
        id="producto-detalle"
        class="detalle-producto__grid"
        hidden
      >

        <!-- ====================================
             3. GALERÍA DE IMÁGENES
             ==================================== -->

        <div class="detalle-producto__galeria">

          <!-- Flecha anterior -->

          <button
            type="button"
            id="galeria-anterior"
            class="galeria-flecha galeria-flecha--izquierda"
            aria-label="Imagen anterior"
          >
            ‹
          </button>

          <!-- Imágenes -->

          <div class="galeria-producto__ventana">
            <div
              id="galeria-producto"
              class="galeria-producto__pista"
            ></div>
          </div>

          <!-- Flecha siguiente -->

          <button
            type="button"
            id="galeria-siguiente"
            class="galeria-flecha galeria-flecha--derecha"
            aria-label="Imagen siguiente"
          >
            ›
          </button>

        </div>


        <!-- ====================================
             4. INFORMACIÓN DEL PRODUCTO
             ==================================== -->

        <div class="detalle-producto__info">

          <!-- Categoría -->

          <p
            id="producto-categoria"
            class="texto-etiqueta"
          ></p>

          <!-- Nombre -->

          <h1 id="producto-nombre"></h1>

          <!-- Precio -->

          <p
            id="producto-precio"
            class="detalle-producto__precio"
          ></p>

          <!-- Descripción -->

          <p
            id="producto-descripcion"
            class="detalle-producto__descripcion"
          ></p>


          <!-- Información de entrega -->

          <div class="detalle-producto__entrega">

            <span class="detalle-producto__entrega-titulo">
              Entrega
            </span>

            <p id="producto-entrega"></p>

            <a
              href="sobre-naura.html#entregas"
              class="detalle-producto__enlace"
            >
              Ver formas de entrega →
            </a>

          </div>


          <!-- Medios de pago -->

          <div class="detalle-producto__pago">

            <span class="detalle-producto__entrega-titulo">
              Medios de pago
            </span>

            <a
              href="sobre-naura.html#pagos"
              class="detalle-producto__enlace"
            >
              Ver formas de pago →
            </a>

          </div>


          <!-- ==================================
               5. WHATSAPP
               ================================== -->

          <a
            id="boton-whatsapp"
            class="boton-principal"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            Consultar por WhatsApp
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- ==========================================
       6. FOOTER
       ========================================== -->

  <div id="footer-placeholder"></div>


  <!-- ==========================================
       7. JAVASCRIPT
       ========================================== -->

  <script src="js/components.js" defer></script>
  <script src="js/sheets.js" defer></script>
  <script src="js/producto-detalle.js" defer></script>

</body>
</html>
