
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NAURA | Accesorios</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/img_logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animaciones.css">
</head>

<body>

  <!-- ==========================================
       1. INTRO NAURA
       ========================================== -->

  <div class="intro-naura" id="intro-naura">

    <div class="intro-naura__marca">

      <div class="intro-naura__logo" aria-label="NAURA">
        <span>N</span>
        <span>A</span>
        <span>U</span>
        <span>R</span>
        <span>A</span>
      </div>

    </div>

  </div>


  <!-- ==========================================
       2. HEADER
       ========================================== -->

  <div id="header-placeholder"></div>


  <!-- ==========================================
       3. CONTENIDO PRINCIPAL
       ========================================== -->

  <main>

    <!-- HERO VISUAL -->

    <section class="hero hero-visual">

      <div class="hero-visual__ventana">

        <div class="hero-visual__pista">

          <!-- Primer grupo -->

          <div class="hero-visual__grupo">

            <div class="hero-visual__item hero-visual__item--alto">
              <img src="img/hero-1.jpg" alt="Accesorios NAURA">
            </div>

            <div class="hero-visual__item">
              <video autoplay muted loop playsinline>
                <source
                  src="img/hero-video-1.mp4"
                  type="video/mp4"
                >
              </video>
            </div>

            <div class="hero-visual__item hero-visual__item--bajo">
              <img src="img/hero-2.jpg" alt="Colección NAURA">
            </div>

            <div class="hero-visual__item hero-visual__item--alto">
              <img src="img/hero-3.jpg" alt="Diseños NAURA">
            </div>

            <div class="hero-visual__item">
              <video autoplay muted loop playsinline>
                <source
                  src="img/hero-video-2.mp4"
                  type="video/mp4"
                >
              </video>
            </div>

          </div>


          <!-- Segundo grupo: continuidad infinita -->

          <div class="hero-visual__grupo" aria-hidden="true">

            <div class="hero-visual__item hero-visual__item--alto">
              <img src="img/hero-1.jpg" alt="">
            </div>

            <div class="hero-visual__item">
              <video autoplay muted loop playsinline>
                <source
                  src="img/hero-video-1.mp4"
                  type="video/mp4"
                >
              </video>
            </div>

            <div class="hero-visual__item hero-visual__item--bajo">
              <img src="img/hero-2.jpg" alt="">
            </div>

            <div class="hero-visual__item hero-visual__item--alto">
              <img src="img/hero-3.jpg" alt="">
            </div>

            <div class="hero-visual__item">
              <video autoplay muted loop playsinline>
                <source
                  src="img/hero-video-2.mp4"
                  type="video/mp4"
                >
              </video>
            </div>

          </div>

        </div>

      </div>


      <!-- Texto y botón del hero -->

      <div class="hero-visual__contenido">

        <p class="hero-visual__subtitulo">
          ACCESORIOS HECHOS PARA DARLE COLOR A TU LOOK
        </p>

        <a href="productos.html" class="boton-principal">
          Ver productos
        </a>

      </div>

    </section>


    <!-- ========================================
         4. PRODUCTOS FAVORITOS
         ======================================== -->

    <section class="destacados contenedor">

      <h2 class="reveal">FAVORITOS</h2>

      <p id="estado-favoritos" role="status">
        Cargando productos...
      </p>

      <div
        id="productos-favoritos"
        class="destacados__grid"
      ></div>

    </section>

  </main>


  <!-- ==========================================
       5. FOOTER
       ========================================== -->

  <div id="footer-placeholder"></div>


  <!-- ==========================================
       6. JAVASCRIPT
       ========================================== -->

  <script src="js/components.js" defer></script>
  <script src="js/sheets.js" defer></script>
  <script src="js/inicio.js" defer></script>
  <script src="js/animaciones.js" defer></script>

</body>
</html>
