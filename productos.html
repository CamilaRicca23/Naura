<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Productos — NAURA</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/img_logo.png">


  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet">


  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

</head>


<body>


  <!-- HEADER -->
  <div id="header-placeholder"></div>


  <main>

    <section class="hero contenedor" style="padding-top: var(--espacio-lg); padding-bottom: var(--espacio-md);">

      <h1 style="font-size: 2.5rem;">PRODUCTOS</h1>
    </section>

    <!-- FILTROS -->
    <section class="filtros contenedor">

      <button class="filtro-boton filtro-boton--activo" data-categoria="todos" type="button">
        Todos
      </button>

      <button class="filtro-boton" data-categoria="cuero" type="button">
        Cuero
      </button>

      <button class="filtro-boton" data-categoria="accesorios" type="button">
        Accesorios
      </button>

    </section>


    <!-- LISTADO DE PRODUCTOS -->
    <section class="destacados contenedor">

      <p id="estado-productos">
        Cargando productos...
      </p>

      <div id="grilla-productos" class="destacados__grid">
      </div>

    </section>


  </main>


  <!-- FOOTER -->
  <div id="footer-placeholder"></div>


  <!-- JAVASCRIPT -->
  <script src="js/components.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/productos.js"></script>


</body>

</html>
