
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contacto — NAURA</title>

  <meta
    name="description"
    content="Contactá a NAURA por WhatsApp o Instagram para consultar sobre nuestros accesorios."
  >

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/img_logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animaciones.css">
</head>

<body>

  <!-- ==========================================
       1. HEADER
       ========================================== -->

  <div id="header-placeholder"></div>


  <!-- ==========================================
       2. CONTENIDO PRINCIPAL
       ========================================== -->

  <main>

    <!-- TÍTULO -->

    <section
      class="hero contenedor"
      style="padding-top: var(--espacio-lg); padding-bottom: var(--espacio-md);"
    >
      <h1 style="font-size: 2.5rem;">
        Contactanos
      </h1>
    </section>


    <!-- OPCIONES DE CONTACTO -->

    <section class="contacto contenedor" aria-label="Canales de contacto">

      <!-- WHATSAPP -->

      <a
        href="https://wa.me/59892066916"
        target="_blank"
        rel="noopener noreferrer"
        class="contacto__tarjeta reveal"
      >

        <span class="contacto__icono" aria-hidden="true">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M20.52 3.48A11.87 11.87 0 0 0 12.05 0C5.46 0 .1 5.36.1 11.95c0 2.11.55 4.17 1.6 5.99L0 24l6.24-1.64a11.9 11.9 0 0 0 5.81 1.48h.01c6.59 0 11.95-5.36 11.95-11.95 0-3.19-1.24-6.19-3.49-8.41ZM12.06 21.82a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.74.98 1-3.65-.23-.38a9.9 9.9 0 0 1-1.52-5.23c0-5.46 4.44-9.9 9.9-9.9a9.83 9.83 0 0 1 7 2.9 9.83 9.83 0 0 1 2.9 7c0 5.46-4.44 9.87-9.91 9.87Zm5.43-7.41c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.48-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.21 5.09 4.5.71.31 1.26.49 1.69.63.71.23 1.35.2 1.86.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"
            />
          </svg>

        </span>

        <span class="contacto__texto">
          <strong>WhatsApp</strong>
          <span>Respondemos a la brevedad</span>
        </span>

      </a>


      <!-- INSTAGRAM -->

      <a
        href="https://instagram.com/naura.uy"
        target="_blank"
        rel="noopener noreferrer"
        class="contacto__tarjeta reveal reveal--delay-1"
      >

        <span class="contacto__icono" aria-hidden="true">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="3.5"
              y="3.5"
              width="17"
              height="17"
              rx="5"
              stroke="currentColor"
              stroke-width="1.6"
            />

            <circle
              cx="12"
              cy="12"
              r="4"
              stroke="currentColor"
              stroke-width="1.6"
            />

            <circle
              cx="17.2"
              cy="6.8"
              r="1"
              fill="currentColor"
            />
          </svg>

        </span>

        <span class="contacto__texto">
          <strong>Instagram</strong>
          <span>@naura.uy</span>
        </span>

      </a>

    </section>

  </main>


  <!-- ==========================================
       3. FOOTER
       ========================================== -->

  <div id="footer-placeholder"></div>


  <!-- ==========================================
       4. JAVASCRIPT
       ========================================== -->

  <script src="js/components.js" defer></script>
  <script src="js/animaciones.js" defer></script>

</body>
</html>
