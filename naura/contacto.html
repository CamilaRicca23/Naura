<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — NAURA</title>

    <link rel="icon" type="image/png" href="img/img_logo.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- CSS (el orden importa) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animaciones.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <main>
    <section class="hero contenedor" style="padding-top: var(--espacio-lg); padding-bottom: var(--espacio-md);">
      
      <h1 style="font-size: 2.5rem;">Contactanos</h1>
   </section>

    <section class="contacto contenedor">

      <a
        href="https://wa.me/59892066916"
        target="_blank"
        rel="noopener noreferrer"
        class="contacto__tarjeta reveal"
      >
        <span class="contacto__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.6 6.3A8.9 8.9 0 0 0 12 4a8.96 8.96 0 0 0-7.8 13.4L4 20l2.7-.7a8.96 8.96 0 0 0 5.3 1.7h0A8.96 8.96 0 0 0 21 12a8.9 8.9 0 0 0-3.4-5.7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.3 9.1c.1-.4.5-.7.9-.7h.5c.3 0 .6.2.7.5l.5 1.2c.1.3 0 .6-.2.8l-.4.4c.4.9 1.1 1.6 2 2l.4-.4c.2-.2.5-.3.8-.2l1.2.5c.3.1.5.4.5.7v.5c0 .4-.3.8-.7.9-1.9.5-4.8-.2-6.4-1.8-1.6-1.6-2.3-4.5-1.8-6.4Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="contacto__texto">
          <strong>WhatsApp</strong>
          <span>Respondemos a la brevedad</span>
        </span>
      </a>

      <a
        href="https://instagram.com/naura.uy"
        target="_blank"
        rel="noopener noreferrer"
        class="contacto__tarjeta reveal reveal--delay-1"
      >
        <span class="contacto__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3.5" y="3.5" width="17" height="17" rx="5" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="17.2" cy="6.8" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span class="contacto__texto">
          <strong>Instagram</strong>
          <span>@naura.uy</span>
        </span>
      </a>

    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/components.js"></script>
  <script src="js/animaciones.js"></script>
</body>
</html>
